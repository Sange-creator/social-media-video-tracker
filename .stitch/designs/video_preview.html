<body class="bg-surface-obsidian text-on-surface font-body-md antialiased min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-obsidian/80 backdrop-blur-xl border-b border-border-hairline flex justify-between items-center px-container-margin h-16">
<button class="text-primary hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">expand_more</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Video Preview</h1>
<div class="flex items-center gap-1 mt-0.5">
<span class="font-label-sm text-label-sm text-text-muted">@FitLifeDaily</span>
<span class="material-symbols-outlined text-[14px] text-primary" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<button class="text-primary hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">ios_share</span>
</button>
</header>
<main class="pt-20 px-container-margin max-w-md mx-auto space-y-section-gap">
<!-- Video Player -->
<div class="relative w-full aspect-[9/16] rounded-xl overflow-hidden bg-surface-glass border border-border-hairline shadow-lg">
<img class="absolute inset-0 w-full h-full object-cover" data-alt="A fitness instructor performing an intense HIIT workout in a gritty, industrial gym setting with dramatic, cinematic blue-cyan spotlights. The scene has high contrast, with deep obsidian shadows and crisp white chalk dust particles suspended in the air. The aesthetic is modern, high-end, and energetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpQ14JEyIcXqkmS5wT5AN4SCIKuys9WyogcsButWbSgPeuYXFXzEefkkXlkAgQY3RT2BrCnSDW5i1N8iZev68OYawjBXzpRvoojs6Bhp4aScPY17ffsjmMEI4CSrv2Cr31U40iJoVoJGTmeeHwQ2YrvKg3pkCzOa6aeT9Brt_5F4RZdSq5DjimTgN0xF-e96mNuOyPfxXsjkUGqDOWJxEGr9yzZ0RRJw4EJtwX9YAGru67HCgqpa5sOkSZ2tufknFYaeP_UuWFdZpE"/>
<!-- Scrim -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-obsidian/60 via-transparent to-surface-obsidian/80"></div>
<!-- Controls overlay -->
<div class="absolute inset-0 p-4 flex flex-col justify-between">
<div class="flex justify-between items-start">
<div class="bg-surface-glass/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-border-hairline flex items-center">
<span class="font-label-sm text-label-sm text-on-surface">1.5x</span>
</div>
<button class="bg-surface-glass/80 backdrop-blur-md p-2 rounded-full border border-border-hairline text-on-surface flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>
<!-- Play Button Center -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-16 h-16 rounded-full bg-surface-glass/60 backdrop-blur-xl border border-white/10 flex items-center justify-center pointer-events-auto cursor-pointer hover:bg-surface-glass/80 transition-colors">
<span class="material-symbols-outlined text-[32px] text-white" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
</div>
<!-- Scrubber -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center px-1">
<span class="font-mono-data text-mono-data text-text-slate">0:18</span>
<span class="font-mono-data text-mono-data text-text-muted">0:45</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[40%] rounded-full relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Metadata Card -->
<div class="bg-surface-glass border border-border-hairline rounded-xl p-4 space-y-stack-md">
<div>
<h2 class="font-headline-md text-[18px] text-text-slate font-semibold truncate">HIIT_Burn_Ep4.mp4</h2>
<div class="flex items-center gap-2 mt-1">
<span class="font-mono-data text-mono-data text-text-muted">1080 x 1920 (9:16) • 60 FPS • 48.6 MB</span>
</div>
</div>
<div class="pt-3 border-t border-border-hairline flex items-center justify-between">
<div class="flex items-center gap-2 overflow-hidden">
<span class="material-symbols-outlined text-text-muted text-[18px]">folder</span>
<span class="font-mono-data text-[11px] text-text-muted truncate">/FitLife_2026/Reels/Q3_Drops/</span>
</div>
<div class="flex items-center gap-1.5 shrink-0 bg-success-emerald/10 px-2 py-1 rounded border border-success-emerald/20">
<div class="w-1.5 h-1.5 rounded-full bg-success-emerald"></div>
<span class="font-label-sm text-[10px] text-success-emerald uppercase tracking-wider">Synced</span>
</div>
</div>
</div>
<!-- Caption Section -->
<div class="bg-surface-glass border border-border-hairline rounded-xl p-4 space-y-stack-md">
<p class="font-body-md text-body-md text-on-surface-variant whitespace-pre-wrap leading-relaxed">
🔥 Ready to crush your weekend workout? Try these 4 explosive HIIT combos!

<span class="text-primary-container">#FitnessMotivation #GymLife #HIITWorkout #DailyReels</span>
</p>
<button class="w-full mt-2 flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-surface-elevated border border-primary/20 text-primary hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-[20px] group-active:scale-90 transition-transform">content_copy</span>
<span class="font-label-md text-label-md font-semibold">Copy Title &amp; Hashtags</span>
</button>
</div>
</main>
<!-- Action Dock -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-surface-obsidian/90 backdrop-blur-xl border-t border-border-hairline flex flex-col gap-3 z-40">
<button class="w-full flex items-center justify-center gap-3 py-3.5 px-4 rounded-lg bg-primary text-on-primary hover:bg-primary/90 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[22px]">photo_library</span>
<div class="flex flex-col items-start">
<span class="font-label-md text-[15px] font-bold">Download Original to Photos</span>
</div>
<span class="ml-auto bg-on-primary/10 text-on-primary font-label-sm text-[10px] px-2 py-0.5 rounded-full border border-on-primary/20">FitLife Videos</span>
</button>
<button class="w-full flex items-center justify-center py-2.5 rounded-lg border border-outline-variant text-text-muted hover:text-on-surface hover:border-outline transition-colors active:bg-surface-variant/50">
<span class="font-label-md text-label-md">Mark as Already Downloaded</span>
</button>
</div>
</body></html>
